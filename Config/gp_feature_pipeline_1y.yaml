# Configuration tuned for GP feature generation on 1-year 5-minute BTCUSDT data
# Adjust the data.path below if your dataset is stored elsewhere.

data:
  path: /Users/yoon-seunggyu/Documents/GA_Tree/GA_tree/dataset/dataset_test/BTCUSDT_5m_1y.csv
  target_column: null
  feature_columns:
    - Open
    - High
    - Low
    - Close
    - Volume
    - Quote asset volume
    - Number of trades
    - Taker buy base asset volume
    - Taker buy quote asset volume
  max_target_corr: 1.

feature:
  mode: numeric # boolean, numeric

timeframe_primitives:
  enabled: true
  base_interval_minutes: 5
  timeframes: [15m, 30m, 1h, 4h, 12h, 1d]
  custom_timeframes: [3d, 1w]
  operators: [high, low, mean, median, std, var, sum, range, ema, lag, diff, pct_change, zscore, skew, kurtosis]
  dynamic_operators:
    - name: custom_mean
      operator: mean
      param_kind: bars
      min_window: 12
      max_window: 288
      allow_partial: false
    - name: custom_high
      operator: high
      param_kind: minutes
      min_window: 60
      max_window: 2880
      allow_partial: false
    - name: custom_std
      operator: std
      param_kind: bars
      min_window: 12
      max_window: 336
      allow_partial: false
    - name: custom_ema
      operator: ema
      param_kind: bars
      min_window: 24
      max_window: 672
      allow_partial: false
  allow_partial_windows: false
  integers_as_rows: false
  lag_fill_strategy: edge

population:
  size: 1200
  generations: 30
  min_depth: 2
  max_depth: 6
  tournament_size: 7
  elitism: 60
  mutation_prob: 0.25
  crossover_prob: 0.75
  seed: 42

backend:
  primary: numexpr
  fallbacks: [numpy]
  cache_subtrees: false
  low_fidelity_ratio: 0.12
  full_eval_top_k: 0.2

fitness:
  numeric:
    metrics: [neg_log_pvalue, effect_size, cliffs_delta, significance_margin, mean_method_effect, effect_stability, pvalue_consistency, min_pvalue]
    weights: [0.8, 1.3, 1.2, 0.6, 0.8, 1.0, 1.0, 0.7]
    maximize: [true, true, true, true, true, true, true, false]
    thresholds:
      neg_log_pvalue: 2.3
      effect_size: 0.10
      cliffs_delta: 0.10
      significance_margin: 0.0
      mean_method_effect: 0.05
      effect_stability: 0.70
      pvalue_consistency: 0.70
      min_pvalue: 0.010

  boolean:
    metrics: [neg_log_pvalue, effect_strength, effect_stability, pvalue_consistency, significance_margin, prop_diff_abs, odds_ratio_abs, cliffs_delta_abs, mutual_information, min_pvalue]
    weights: [0.8, 1.3, 1.2, 1.0, 0.5, 1.0, 0.7, 1.2, 1.0, 0.7]
    maximize: [true, true, true, true, true, true, true, true, true, false]
    thresholds:
      neg_log_pvalue: 2.3
      effect_strength: 0.10
      effect_stability: 0.70
      pvalue_consistency: 0.70
      significance_margin: 0.0
      prop_diff_abs: 0.08
      odds_ratio_abs: 1.30
      cliffs_delta_abs: 0.10
      mutual_information: 0.001
      min_pvalue: 0.010


validator:
  enabled: true
  numeric_kwargs:
    combine_method: simes
    min_bars_per_split: 256
    screening_methods:
      spearman:
        enabled: true
        cliffs_delta: true
    verbose: false
  boolean_kwargs:
    combine_method: simes
    alpha: 0.02
    min_bars_per_split: 256
    screening_methods:
      fisher_exact:
        enabled: true
        event_threshold: 0.001
      prop_ztest:
        enabled: true
        alpha: 0.02
      mutual_information:
        enabled: true
        permutations: 256
    verbose: false

output:
  artifacts_dir: ../results/gp_pipeline_numeric/one_year
  save_best: 200
  save_population: true
