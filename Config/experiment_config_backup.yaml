# 7. 피처 분류 및 모델 입력 설정 (수정됨)
feature_classification:
  # 6-1. 피처 vs 숫자 비교 (Feature vs Number)에 사용할 피처 목록
  # key: 피처 이름의 접두사, value: [최소값, 최대값] 범위
  feature_num:
    close_change_pct: [-10, 10]
    body_size: [0, 100]
    upper_wick_size: [0, 200]  # % of close
    lower_wick_size: [0, 200]  # % of close
    total_range: [0, 200]      # % of close
    body_to_range_ratio: [0, 1]
    RSI: [0, 100]
    '%K': [0, 100]
    '%D': [0, 100]
    Williams_R: [-100, 0]
    CCI: [-250, 250]
    STOCHRSI_K: [0, 100]
    STOCHRSI_D: [0, 100]
    PPO: [-50, 50]
    ROC: [-50, 50]
    ULTOSC: [0, 100]
    MOM: [-100, 100]
    MACD: [-50, 50]
    MACD_Signal: [-50, 50]
    MACD_Hist: [-20, 20]
    ADX: [0, 100]
