# /Config/experiment_config.yaml
# ==================================
# GA Trading Bot Experiment Config
# ==================================
# 이 파일은 전체 실험의 하이퍼파라미터와 설정을 중앙에서 관리합니다.

# 1. 환경 및 경로 설정
environment:
  device: 'cuda:0' # 학습에 사용할 장치 ('cuda:0', 'cpu' 등)
  seed: 42
  output_dir: "results/exp_cpcv_test" # 결과 파일이 저장될 디렉터리
  data_dir: "/root/workspace/GA_tree/dataset"

# 1.0. Training Resumption 설정
resumption:
  auto_resume: true              # 시작 시 자동으로 체크포인트 감지 및 재개
  checkpoint_frequency: 1         # N 세대마다 체크포인트 저장 (1 = 매 세대)
  cleanup_old_checkpoints: true   # 오래된 체크포인트 자동 정리
  keep_last_n_generations: 5     # 보관할 최근 세대 수 (정리 시)
  strict_validation: true         # 엄격한 설정 및 데이터 호환성 검증

# 1.1. Weights & Biases 설정
wandb:
  enabled: false          # wandb 로깅 사용 여부
  project: "GA_tree_CPCV" # 프로젝트명
  entity: null            # 팀/엔티티 (없으면 null)
  group: "CPCV"           # 그룹 태그
  job_type: "train"
  tags: ["ga", "tree", "cpcv"]
  mode: "online"         # "online" | "offline" | "disabled"
  dir: "results/exp_cpcv_test"
  log_tables_topk: 200
  analysis_max_features: 10
  log_quantile_bins: 10
  log_artifacts: true
  gen_log: true
  gen_log_interval: 1
  gen_log_tables_topk: 0
  monitoring:
    enabled: false
    metrics: ["psr", "t_stat", "profit_per_trade", "avg_holding_period", "max_win_streak", "max_loss_streak"]

# 2. 데이터 설정
data:
  symbol: "BTCUSDT"
  interval: "5m"
  days_to_fetch: 2555
  train_ratio: 0.8 # 학습 데이터 비율
  merged_csv_path: "BTCUSDT_5m_30d.csv"
  final_features_path: "final_test_features.csv"
  model_config_path: "model_test_config.yaml"
  feature_engineering:
    target_timeframes: ['5m', '30m', '1h', '4h', '1d']
    config_yaml_path: "Config/feature_config.yaml"

# 3. GA 핵심 파라미터
ga_core:
  population:
    size: 10000
    max_nodes: 128
    max_depth: 7
    max_children: 10
  evolution_loop:
    generations: 20
    parent_pool_size: 6000
    elite_size: 300
    best_chromosome_pool_size: 500
    warming_steps: 0
    early_stopping:
      enabled: false
      metric: "median_oos_sharpe" # CPCV 모드에 맞춰 모니터링 지표 변경
      stat: "mean"
      patience: 5
      min_delta: 0.0
      warmup_generations: 0

# 4. GA 연산자 상세 설정
operators:
  selection:
    type: "PPTSSelection"
    tournament_k_size: 5
    chunk_size: 8192
  crossover:
    weights: [0.4, 0.4, 0.2]
    subtree_crossover:
      mode: 'context'
    node_crossover:
      mode: 'context'
  mutation:
    probabilities:
      add_node: 0.2
      delete_node: 0.2
      add_subtree: 0.1
      delete_subtree: 0.1
      reinitialize_node: 0.1
      node_param: 0.3
    node_param_mutation:
      noise_ratio: 0.1
      leverage_change: 5
    add_node_mutation:
      max_add_nodes: 12
    delete_node_mutation:
      max_delete_nodes: 5
    add_subtree_mutation:
      node_count_range: [4, 10]

# 5. 학습 전략 및 CPCV 설정 (수정됨)
training_strategy:
  mode: "cpcv"              # "wfo" -> "cpcv" 로 변경
  max_hold_period_bars: 1440  # 5일 @ 5분봉. Purge/Embargo 기본값으로 사용됨

# === CPCV (Combinatorial Purged Cross-Validation) 설정 (신규 추가) ===
cpcv:
  folds: 10
  test_folds: 2
  shuffle_seed: 42
  purge_bars: null          # null이면 training_strategy.max_hold_period_bars 사용
  embargo_bars: null        # null이면 training_strategy.max_hold_period_bars 사용
  min_trades_per_split: 32
  max_combinations: null
  parallel_chunks: 4
  reuse_population: true
  evaluation_cache_dir: "results/cpcv_cache"
  holdout:
    bars: 0               # 마지막 N개 바를 holdout으로 사용 (0이면 비활성)
    ratio: null           # bars가 설정되지 않았을 때 사용할 비율 (0~1)
    min_bars: 512         # holdout으로 최소 확보하고 싶은 바 수
    max_bars: null        # 설정 시 holdout 상한

selection_pipeline:
  enabled: true
  dry_run: false  # 실제 파일에 결과를 저장하려면 false로 설정

  supervision: supervised
  target:
    mode: multi_horizon_risk_adjusted
    params:
      horizons: [1, 12, 72, 288]
      price_in_column: markPrice_est
      price_out_column: markPrice_est
      open_column: Open
      close_column: Close
      atr_column: ATR_7_5m
      atr_scale: 100.0
      volatility_floor: 1.0e-4
      weights: {type: exponential, lambda: 0.01}
      winsor_limits: [0.005, 0.995]

  artifact_dir: "results/selection_artifacts" # 결과물이 저장될 경로
  min_bars_per_split: 5000 # 분할(fold)당 최소 데이터 수 (7년 데이터이므로 충분히 높게 설정)

  # Stage 1: 타깃 의존성 기반 스크리닝
  stage1_screening:
    methods:
      spearman: {enabled: true, cliffs_delta: true}
      hsic_rff: {enabled: true, rff_dim: 256, permutations: 64, block_size: 288}
      dcor_sampled: {enabled: true, sample_size: 2048, permutations: 64, block_size: 288}
    combine: {method: empirical_brown, alpha: 0.05, fdr: by}
    enforce_significance: true
    effect_min: 0.01

  # Stage 2: 안정성 + Knockoff 기반 대표 선택
  stage2_selection:
    enabled: true
    corr_cap: 0.9
    max_features: 128

    stability_selection:
      enabled: true
      subsamples: 64
      sample_fraction: 0.7
      cutoff: 0.6
      max_features: 64

    knockoffs:
      enabled: true
      fdr: 0.1
      statistic: correlation
      shrinkage: 0.001
      generator: modelx
      fallback: [robust]

  # Stage 3: 다양성 확보 (서로 다른 종류의 피처 선택)
  stage3_diversity:
    enabled: true
    method: facility_location
    top_k: 64
    family_cap: {max_per_family: 3}

  # Stage 4: 최종 보정 및 정리
  stage4_calibration:
    vif_threshold: 10.0
    robust_quantiles: [0.01, 0.99]
    mad_margin: {factor: 1.4826}
    boolean_stats: {enabled: true, samples: 200, block_size: 288, alpha: 0.05}

# 5.1 Walk-Forward Optimization 설정 (데이터 길이에 맞게 재계산)
walk_forward:
  enabled: true # CPCV 모드 사용 시 이 값은 무시되지만, WFO 전환을 위해 유지
  # === 테스트 학습용 윈도우 크기 (총 데이터 105,253개 기준) ===
  # - 인샘플(학습): ~70% -> 75,000 바
  # - 아웃오브샘플(OOS): ~15% -> 15,000 바
  # - 스텝: OOS와 동일하게 15,000 바
  train_bars: 75000
  oos_bars: 15000
  step_bars: 15000
  scheme: "sliding"
  warmup_bars: 8640         # 1개월 (30*288)
  embargo_bars: 0
  min_trades_per_window: 48
  reset_population_each_window: true
  adjacency_cache: false

# 6. 평가 및 시뮬레이션 설정
evaluation:
  simulation_env:
    taker_fee_rate: 0.0004
    maintenance_margin_rate: 0.005
    slippage:
      mode: 'relative_volatility'
      base_rate: 0.0001
      atr_ma_window: 50
      min_slippage: 0.00005
      max_slippage: 0.002
      atr_column: ATR_7_5m
      atr_ma_column: ATR_7_MA_14_5m
      atr_pattern: 'ATR_[0-9]+.*'
      atr_ma_pattern: 'ATR_[0-9]+.*_MA_[0-9]+'
    max_leverage: 100
    use_real_mark_price: false
    equity_mtm_basis: "mark_proxy"
    liq_clearance_fee_rate: 0.003
    min_entry_ratio: 0.05
    max_entry_ratio: 0.5
    min_leverage: 2
    min_additional_enter_ratio: 0.05
    max_additional_entries: 5
    enable_action_dedup: true
    dedup_exclude_types: [4, 5]
    dedup_compare_cols: 3
    dedup_atol: 1.0e-6
    dedup_rtol: 1.0e-4
    dedup_require_applied: true
  
  # === WFO 사용시 목표 설정 (CPCV 모드에서는 사용되지 않음) ===
  is_objectives:
    objectives: ["mean_return", "max_drawdown", "psr", "root_balance_penalty"]
    minimize: [false, true, false, true]
    normalization: "minmax"
    psr_sr_benchmark: 0.5
  complexity:
    mode: "weighted"
    size_weight: 0.5
    depth_weight: 0.5
    min_nodes: 32
    
  oos_objectives:
    objectives: ["mean_return", "max_drawdown", "sharpe_ratio", "psr", "win_rate", "profit_factor", "calmar_ratio", "sortino_ratio", "volatility", "omega_ratio", "information_ratio", "compound_value", "trade_win_rate", "turnover"]
    minimize: [false, true, false, false, false, false, false, false, true, false, false, false, false, true]
    normalization: "minmax"
    risk_free_rate: 0.0
    volatility_lookback: 30
    psr_sr_benchmark: 0.5
    mar: 0.0
    benchmark_mode: "close_to_next_open"
  oos_aggregate:
    objectives: ["oos_mean_return", "oos_max_drawdown", "oos_psr", "oos_consistency"]
    minimize: [false, true, false, false]
    methods: ["mean", "max", "mean", "hit_rate"]
    include_dsr: true
    dsr_method: "mean"
    dsr_minimize: false
    dsr_sr_benchmark: 0.5
    thresholds:
      min_return: 0.0
      max_dd: 0.3
    weights: null
    normalization: "minmax"
  pruning:
    enabled: true
    k_min: 1
    tau_use: 0.0
    tau_ineff: 1.1
    k_perf_min: 9999999
    tau_wr: 0.0
    k_harm: 9999999
    delta_harm: 0.001
    m_min: 1
    w_use: 0.2
    w_ineff: 0.2
    w_pnl: 0.5
    w_wr: 0.1
  fitness_function:
    minimum_trades: 5

# === CPCV 전용 다중 목적 지표 설정 (신규 추가) ===
fitness_objectives:
  cpcv_objectives:
    names: [
      "median_oos_return", "median_oos_sharpe", "iqr_oos_sharpe", "cvar95_oos_return",
      "oos_turnover", "tree_complexity", "median_oos_psr", "median_oos_profit_factor",
      "iqr_oos_drawdown", "is_mean_return", "is_max_drawdown", "is_psr",
      "is_root_balance_penalty"
    ]
    minimize: [
      false, false, true, true, true, true, false, false, true, false, true, false, true
    ]
    normalization: "minmax"

# Robustness Filter 설정 (CPCV post-selection, 신규 추가)
robustness_filter:
  pbo:
    enabled: true
    min_splits: 12
    cscv_k: 2
    threshold: 0.2
  dsr:
    enabled: true
    sr_benchmark: 0.0
    min_value: 0.0
  spa:
    enabled: true
    bootstrap_samples: 5000
    studentized: true
    alpha: 0.05
  block_bootstrap:
    enabled: true
    method: "stationary"
    block_length: 50
    samples: 5000
  mintrl:
    enabled: true
    confidence: 0.95

